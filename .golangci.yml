version: "2"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - fatcontext
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - ifElseChain
        - appendCombine
        - exitAfterDefer

    gosec:
      excludes:
        - G104
        - G115

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: true

    revive:
      rules:
        - name: dot-imports
          disabled: true

    errorlint:
      asserts: false

  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - gosec
